
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access - EMRS Angan</title>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #0b132b;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(16,185,129,.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(56,189,248,.15), transparent 40%),
                linear-gradient(to bottom, rgba(11,19,43,.8), rgba(11,19,43,.92)),
                url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&w=2000&q=85') center/cover no-repeat fixed;
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 48px;
            width: 100%;
        }

        .logo-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,.25);
            text-decoration: none;
            transition: .3s;
        }

        .logo-badge:hover {
            transform: translateY(-2px);
            background: white;
        }

        .logo-badge img {
            height: 46px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-weight: 800;
            font-size: 1rem;
            color: #0f172a;
        }

        .logo-subtitle {
            font-size: .72rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            flex-grow: 1;
        }

        .register-card {
            background: rgba(15,23,42,.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 28px;
            padding: 44px 38px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,.5),
                        0 0 40px rgba(16,185,129,.1);
            animation: cardAppear .8s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(16,185,129,.15);
            border: 1px solid rgba(16,185,129,.3);
            border-radius: 20px;
            color: #34d399;
            font-size: .75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .register-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }

        .register-header p {
            font-size: .9rem;
            color: #94a3b8;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: .83rem;
            margin-bottom: 6px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.icon-left {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15,23,42,.7);
            border: 1.5px solid rgba(255,255,255,.12);
            border-radius: 12px;
            color: white;
            font-size: .9rem;
            outline: none;
            transition: .3s;
            appearance: none;
        }

        .input-wrapper select {
            cursor: pointer;
        }

        .input-wrapper select option {
            background: #0f172a;
            color: white;
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: #34d399;
            box-shadow: 0 0 0 4px rgba(52,211,153,.18);
        }

        .role-fields {
            display: none;
            animation: fadeIn .4s ease-out;
        }

        .role-fields.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg,#059669,#0284c7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: .98rem;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 8px 20px -4px rgba(5,150,105,.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(5,150,105,.7);
        }

        .btn-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .login-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: .85rem;
            color: #94a3b8;
        }

        .login-prompt a {
            color: #34d399;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 18px;
            font-size: .82rem;
            color: #64748b;
            background: rgba(11,19,43,.85);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,.05);
        }

        @media (max-width:600px) {
            header {
                padding: 16px 20px;
            }

            .logo-text {
                display: none;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .register-card {
                padding: 32px 20px;
            }
        }
    </style>
</head>

<body>

<div class="bg-overlay"></div>

<!-- HEADER -->
<header>
    <a href="index.html" class="logo-badge">
        <img src="emrs_logo.jpg" alt="EMRS Logo">
        <div class="logo-text">
            <span class="logo-title">EMRS</span>
            <span class="logo-subtitle">Residential School</span>
        </div>
    </a>

    <a href="index.html" class="logo-badge">
        <img src="msa.gif" alt="Muni Seva Ashram Logo">
        <div class="logo-text">
            <span class="logo-title">MSA</span>
            <span class="logo-subtitle">Muni Seva Ashram</span>
        </div>
    </a>
</header>

<!-- REGISTRATION FORM -->
<main>
    <div class="register-card">

        <div class="register-header">
            <div class="brand-pill">
                <i class="fa-solid fa-user-plus"></i>
                Access Request
            </div>

            <h1>Join EMRS Angan</h1>
            <p>Submit your details for institutional approval</p>
        </div>

        <form id="registerForm">

            <div class="input-group">
                <label for="fullname">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" placeholder="e.g. Rahul Sharma" required>
                    <i class="fa-solid fa-user icon-left"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Institutional Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="student@example.com" required>
                    <i class="fa-solid fa-envelope icon-left"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="role">Select Your Role</label>
                <div class="input-wrapper">
                    <select id="role" required>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher / Faculty</option>
                        <option value="hostel_mgmt">Hostel Management</option>
                    </select>
                    <i class="fa-solid fa-user-tag icon-left"></i>
                </div>
            </div>

            <!-- STUDENT -->
            <div class="input-group role-fields active" id="studentFields">
                <label for="class_grade">Grade / Class</label>
                <div class="input-wrapper">
                    <select id="class_grade">
                        <option>Class 6</option>
                        <option>Class 7</option>
                        <option>Class 8</option>
                        <option>Class 9</option>
                        <option>Class 10</option>
                        <option>Class 11 - Science</option>
                        <option>Class 11 - General</option>
                        <option>Class 12 - Science</option>
                        <option>Class 12 - General</option>
                    </select>
                    <i class="fa-solid fa-graduation-cap icon-left"></i>
                </div>
            </div>

            <!-- TEACHER -->
            <div class="input-group role-fields" id="teacherFields">
                <label for="subject_taught">Subject Taught</label>
                <div class="input-wrapper">
                    <select id="subject_taught">
                        <option>Mathematics</option>
                        <option>Science & Technology</option>
                        <option>English Literature</option>
                        <option>Social Studies</option>
                        <option>Gujarati / Hindi</option>
                        <option>Computer Science / IT</option>
                        <option>Sports & Physical Ed</option>
                        <option>Physics</option>
                        <option>Chemistry</option>
                        <option>Biology</option>
                    </select>
                    <i class="fa-solid fa-book-open icon-left"></i>
                </div>
            </div>

            <!-- HOSTEL MANAGEMENT -->
            <div class="input-group role-fields" id="hostelFields">
                <label for="hostel_department">Hostel Department / Wing</label>
                <div class="input-wrapper">
                    <select id="hostel_department">
                        <option>Boys Hostel Warden</option>
                        <option>Girls Hostel Warden</option>
                        <option>Bhojanalay / Mess Department</option>
                        <option>General Hostel Administration</option>
                    </select>
                    <i class="fa-solid fa-hotel icon-left"></i>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="form-row">

                <div class="input-group">
                    <label for="password">Create Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>
                        <i class="fa-solid fa-lock icon-left"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" placeholder="Confirm password" minlength="8" required>
                        <i class="fa-solid fa-circle-check icon-left"></i>
                    </div>
                </div>

            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Submit Request</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>

            <div class="login-prompt">
                Already have an approved account?
                <a href="login.html">Sign In</a>
            </div>

        </form>
    </div>
</main>

<footer>
    <p>&copy; 2026 EMRS Angan | Muni Seva Ashram. All rights reserved.</p>
</footer>

<script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL = 'https://yykiwrkiddimqcpfuphj.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_jgRMw9AsmYFSJ-hn2_2R6A_YFiJ3Qtt';

    // Reuse the existing client if another script initialized it.
    // No top-level "const supabase" declaration is used.
    if (!window.supabaseClient) {
        window.supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
    }

    // ==========================================
    // ROLE SWITCHER
    // ==========================================

    function handleRoleChange() {

        const role = document.getElementById('role').value;

        document.getElementById('studentFields').classList.remove('active');
        document.getElementById('teacherFields').classList.remove('active');
        document.getElementById('hostelFields').classList.remove('active');

        if (role === 'student') {
            document.getElementById('studentFields').classList.add('active');
        }

        else if (role === 'teacher') {
            document.getElementById('teacherFields').classList.add('active');
        }

        else if (role === 'hostel_mgmt') {
            document.getElementById('hostelFields').classList.add('active');
        }
    }

    document.getElementById('role').addEventListener('change', handleRoleChange);

    // ==========================================
    // REGISTRATION
    // ==========================================

    document.getElementById('registerForm').addEventListener('submit', async function(e) {

        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');

        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const role = document.getElementById('role').value;

        const password = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm_password').value;

        // Password validation
        if (password !== confirmPass) {
            alert("Passwords do not match.");
            return;
        }

        if (password.length < 8) {
            alert("Password must contain at least 8 characters.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

        try {

            // STEP 1: CREATE AUTH ACCOUNT

            const { data: authData, error: authError } =
                await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

            if (authError) {
                throw authError;
            }

            const userId = authData.user?.id;

            if (!userId) {
                throw new Error("Registration could not be completed. Please try again.");
            }

            // STEP 2: CREATE PROFILE DATA

            const profileData = {
                id: userId,
                fullname: fullname,
                email: email,
                role: role,
                is_approved: false
            };

            if (role === 'student') {
                profileData.class_grade =
                    document.getElementById('class_grade').value;
            }

            else if (role === 'teacher') {
                profileData.subject_taught =
                    document.getElementById('subject_taught').value;
            }

            else if (role === 'hostel_mgmt') {
                profileData.hostel_department =
                    document.getElementById('hostel_department').value;
            }

            // STEP 3: INSERT INTO PROFILES TABLE

            const { error: profileError } = await window.supabaseClient
                .from('profiles')
                .insert([profileData]);

            if (profileError) {
                throw profileError;
            }

            // SUCCESS

            alert(
                "Your access request has been submitted successfully! " +
                "Please wait for Admin approval."
            );

            document.getElementById('registerForm').reset();
            handleRoleChange();

        }

        catch (error) {

            console.error("Registration Error:", error);

            alert("Registration Error: " + error.message);

        }

        finally {

            submitBtn.disabled = false;

            submitBtn.innerHTML =
                '<span>Submit Request</span>' +
                '<i class="fa-solid fa-paper-plane"></i>';

        }

    });

</script>

</body>
</html>
```
