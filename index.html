
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AANGAN - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #d97706;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #d97706;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #b45309;
        }

        .signup {
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #d97706;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>AANGAN</h1>
        <p>Welcome Back! Please Login</p>

        <form id="loginForm">

            <input type="email" id="email"
                placeholder="Email Address" required>

            <input type="password" id="password"
                placeholder="Password" required>

            <button type="submit">Login</button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

    </div>

</body>
</html>
