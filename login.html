<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EMRS Angan</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase JavaScript Client Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           1. RESET & CORE STYLES
           ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #0b132b;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* High-Res Campus Background Image Overlay */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.2) 0%, transparent 40%),
                linear-gradient(to bottom, rgba(11, 19, 43, 0.75), rgba(11, 19, 43, 0.88)),
                url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&w=2000&q=85') center/cover no-repeat fixed;
            z-index: -1;
        }

        /* =========================================================
           2. HEADER & LOGOS (Top Navigation Bar)
           ========================================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            width: 100%;
        }

        .logo-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-badge:hover {
            transform: translateY(-3px);
            background: #ffffff;
        }

        .logo-badge img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-weight: 800;
            font-size: 1rem;
            color: #0f172a;
            line-height: 1.2;
        }

        .logo-subtitle {
            font-size: 0.72rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }

        /* =========================================================
           3. MAIN LOGIN CONTAINER
           ========================================================= */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            flex-grow: 1;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.1);
            position: relative;
            animation: cardAppear 0.8s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .login-header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 0.92rem;
            color: #94a3b8;
        }

        /* Form Controls */
        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.icon-left {
            position: absolute;
            left: 16px;
            color: #64748b;
            font-size: 1.05rem;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 44px 14px 46px;
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }

        .input-wrapper input:focus {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #38bdf8;
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: #0284c7;
            cursor: pointer;
            border-radius: 4px;
        }

        .forgot-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(2, 132, 199, 0.7);
        }

        /* Sign Up Prompt */
        .signup-prompt {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            color: #94a3b8;
        }

        .signup-prompt a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        /* =========================================================
           4. FOOTER
           ========================================================= */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.82rem;
            color: #64748b;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 640px) {
            header { padding: 16px 20px; }
            .logo-text { display: none; }
            .login-card { padding: 36px 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <!-- =========================================================
         HEADER: BRAND LOGOS
         ========================================================= -->
    <header>
        <!-- LEFT TOP LOGO: EMRS -->
        <a href="index.html" class="logo-badge">
            <img src="EMRS_Logo.png" alt="EMRS Logo">[cite: 1]
            <div class="logo-text">
                <span class="logo-title">EMRS</span>
                <span class="logo-subtitle">Residential School</span>
            </div>
        </a>

        <!-- RIGHT TOP LOGO: MUNI SEVA ASHRAM -->
        <a href="index.html" class="logo-badge">
            <img src="muni_seva_ashram.jpg" alt="Muni Seva Ashram Logo">[cite: 2]
            <div class="logo-text">
                <span class="logo-title">MSA</span>
                <span class="logo-subtitle">Muni Seva Ashram</span>
            </div>
        </a>
    </header>

    <!-- =========================================================
         MAIN LOGIN INTERFACE
         ========================================================= -->
    <main>
        <div class="login-card">
            <div class="login-header">
                <div class="brand-pill"><i class="fa-solid fa-graduation-cap"></i> Student & Staff Portal</div>
                <h1>EMRS Angan</h1>
                <p>Enter your credentials to access your dashboard</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="student@emrsangan.edu.in" required>
                        <i class="fa-solid fa-envelope icon-left"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock icon-left"></i>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- Form Options -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Sign Up Prompt -->
                <div class="signup-prompt">
                    Don't have an account? <a href="https://philipchaudhari.github.io/EMRS-AANGAN/">Request Access</a>
                </div>
            </form>
        </div>
    </main>

    <!-- =========================================================
         FOOTER
         ========================================================= -->
    <footer>
        <p>&copy; 2026 EMRS Angan | Muni Seva Ashram. All rights reserved.</p>
    </footer>

    <!-- SUPABASE AUTHENTICATION SCRIPT -->
    <script>
        // Replace with your actual Supabase project credentials
      <!-- SUPABASE AUTHENTICATION SCRIPT -->

    // 1. Set your full URL and Anon Key correctly
    const SUPABASE_URL = 'https://yykiwrkiddimqcpfuphj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jgRMw9AsmYFSJ-hn2_2R6A_YFiJ3Qtt';
    
    // 2. Pass the variables into createClient
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Show/Hide Password Toggle
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Handle Form Submission with Supabase Auth
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert('Login Failed: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
                } else {
                    // Successful login: Redirect to home dashboard
                    window.location.href = 'home.html';
                }
            } catch (err) {
                console.error('Authentication error:', err);
                alert('An unexpected error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        }
    </script>
</body>
</html>
